[global]
ioengine=sync
direct=0
buffered=1
numjobs=10
group_reporting=1
runtime=1800
time_based=1
randrepeat=0
norandommap=1
fallocate=none
directory=/mnt/ufs

[seq-write]
stonewall
rw=write
bs=128k
size=256m
numjobs=4
new_group=1

[seq-read]
stonewall
rw=read
bs=128k
size=256m
numjobs=4
new_group=1

[rand-rw]
stonewall
rw=randrw
rwmixread=60
bs=4k
size=128m
numjobs=10
new_group=1
